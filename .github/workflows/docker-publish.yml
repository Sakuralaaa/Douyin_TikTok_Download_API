name: Publish GHCR images

on:
  push:
    branches: [main, release]
    tags: ["v*"]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "docker/**"
      - "src/**"
      - "web/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "docker/**"
      - "src/**"
      - "web/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tested images to GHCR"
        type: boolean
        default: true

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, browser, downloader]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      IMAGE_KIND: ${{ matrix.image }}
      IMAGE_ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Image names and pinned browser
        id: config
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}"
          dockerfile="docker/Dockerfile"
          case "$IMAGE_KIND" in
            browser) image+="-browser"; dockerfile+=".browser" ;;
            downloader) image+="-downloader"; dockerfile+=".downloader" ;;
          esac
          source docker/browser-version.env
          [[ "$CLOAKBROWSER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "image=$image"
            echo "dockerfile=$dockerfile"
            echo "local_tag=dtk-${IMAGE_KIND}:smoke"
            echo "platform_tag=${image}:sha-${GITHUB_SHA}-${IMAGE_ARCH}"
            echo "version=$(git describe --tags --always)"
            echo "browser_repo=$CLOAKBROWSER_REPO"
            echo "browser_commit=$CLOAKBROWSER_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Validate shell and Compose configuration
        if: matrix.image == 'app' && matrix.platform.arch == 'amd64'
        run: |
          bash -n docker/smoke-images.sh
          docker compose -f docker/compose.yml config -q
          docker compose -f docker/compose.yml -f docker/compose.ghcr.yml \
            --profile browser --profile downloader config --format json \
            | jq -e '[.services | to_entries[] | select(.key != "postgres" and .key != "redis") | .value] | all(.[]; .build == null and (.image | startswith("ghcr.io/")))'

      - uses: docker/setup-buildx-action@v4

      # Build and launch Chromium on native runners rather than under QEMU.
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          push: false
          tags: ${{ steps.config.outputs.local_tag }}
          build-args: |
            VERSION=${{ steps.config.outputs.version }}
            CLOAKBROWSER_REPO=${{ steps.config.outputs.browser_repo }}
            CLOAKBROWSER_COMMIT=${{ steps.config.outputs.browser_commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          provenance: false
          sbom: false

      - name: Smoke test the built image
        env:
          LOCAL_IMAGE: ${{ steps.config.outputs.local_tag }}
        run: bash docker/smoke-images.sh "$IMAGE_KIND" "$LOCAL_IMAGE"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Moving tags are assembled only after all six native builds pass.
      - name: Push tested architecture and record digest
        if: env.PUBLISH == 'true'
        env:
          LOCAL_IMAGE: ${{ steps.config.outputs.local_tag }}
          PLATFORM_TAG: ${{ steps.config.outputs.platform_tag }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$PLATFORM_TAG"
          docker push "$PLATFORM_TAG"
          reference=$(docker image inspect "$PLATFORM_TAG" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == *@sha256:* ]]
          mkdir -p "$RUNNER_TEMP/digests"
          jq -n --arg reference "$reference" --arg arch "$IMAGE_ARCH" \
            '{reference: $reference, architecture: $arch}' \
            > "$RUNNER_TEMP/digests/${IMAGE_ARCH}.json"

      - name: Upload image digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} manifest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [app, browser, downloader]
    steps:
      - name: Image name
        id: config
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$IMAGE_KIND" in
            browser) image+="-browser" ;;
            downloader) image+="-downloader" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download tested digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.config.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Publish multi-platform manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ steps.config.outputs.image }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/digests/amd64.json"
          test -f "$RUNNER_TEMP/digests/arm64.json"
          mapfile -t references < <(jq -r '.reference' "$RUNNER_TEMP"/digests/*.json)
          arguments=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || arguments+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${arguments[@]}" "${references[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA"
          {
            echo "### $IMAGE_NAME"
            echo
            echo "Native AMD64 and ARM64 builds and smoke tests passed."
            echo
            echo '```text'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

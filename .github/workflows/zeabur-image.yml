name: Publish Zeabur image

on:
  workflow_run:
    workflows: ["Publish GHCR images"]
    types: [completed]
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: zeabur-image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Zeabur (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Image names
        id: config
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "app=${repository}:sha-${SOURCE_SHA}-${IMAGE_ARCH}"
            echo "downloader=${repository}-downloader:sha-${SOURCE_SHA}-${IMAGE_ARCH}"
            echo "target=${repository}-zeabur:sha-${SOURCE_SHA}-${IMAGE_ARCH}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build shared-storage image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.zeabur
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: dtk-zeabur:smoke
          build-args: |
            APP_IMAGE=${{ steps.config.outputs.app }}
            DOWNLOADER_IMAGE=${{ steps.config.outputs.downloader }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: false
          sbom: false
      - name: Validate complete service
        run: |
          bash -n docker/smoke-zeabur.sh
          bash docker/smoke-zeabur.sh dtk-zeabur:smoke
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        env:
          TARGET: ${{ steps.config.outputs.target }}
        run: |
          set -euo pipefail
          docker tag dtk-zeabur:smoke "$TARGET"
          docker push "$TARGET"
          reference=$(docker image inspect "$TARGET" --format '{{index .RepoDigests 0}}')
          [[ "$reference" == *@sha256:* ]]
          mkdir -p "$RUNNER_TEMP/digests"
          jq -n --arg reference "$reference" '{reference: $reference}' \
            > "$RUNNER_TEMP/digests/${IMAGE_ARCH}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: zeabur-digest-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zeabur-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native multi-platform image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-zeabur"
          test -f "$RUNNER_TEMP/digests/amd64.json"
          test -f "$RUNNER_TEMP/digests/arm64.json"
          mapfile -t references < <(jq -r '.reference' "$RUNNER_TEMP"/digests/*.json)
          docker buildx imagetools create \
            --tag "$image:sha-$SOURCE_SHA" --tag "$image:$SOURCE_BRANCH" \
            --tag "$image:latest" "${references[@]}"
          docker buildx imagetools inspect "$image:sha-$SOURCE_SHA"
          printf 'Published `%s:sha-%s` for AMD64 and ARM64.\n' "$image" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
